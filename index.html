Carregando...
<script>
// o discordia de verdade fica guardado no Supabase: assim cada atualização chega pra todo mundo no F5
fetch("https://fjixakqzozuqnjvpwaos.supabase.co/storage/v1/object/public/site/app.html?v=" + Date.now(), { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => { document.open(); document.write(html); document.close(); })
  .catch(e => { document.body.textContent = "Não carregou (" + e.message + "). Dá F5."; });
</script>
</body>
